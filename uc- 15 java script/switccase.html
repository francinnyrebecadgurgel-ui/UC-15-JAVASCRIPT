<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Frete</title>
    <link rel="stylesheet" href="switcase.css" />
  </head>
  <body>
    <main class="container">
      <h1>Calculadora de frete</h1>

      <label for="estado">Digite a sigla do estado:</label>
      <input id="estado" type="text" placeholder="Ex: SP, RJ, RS, AM" maxlength="2" />
      <button id="calcular" type="button">Calcular</button>

      <div id="resultado" class="resultado">
        Informe a sigla do estado.
      </div>
    </main>

    <script src="swittccase.js"></script>
  </body>
</html>
